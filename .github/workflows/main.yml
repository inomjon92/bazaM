name: Android APK Build
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Kodlarni yuklab olish
        uses: actions/checkout@v3

      - name: Java JDK 17 ni o'rnatish
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: ZIP faylni avtomat ochish
        run: |
          unzip -o qarz-avtomat.zip || true

      - name: Gradle poydevorini tiklash va APK yig'ish
        run: |
          gradle wrapper
          ./gradlew assembleRelease

      - name: Tayyor APK faylini saqlash
        uses: actions/upload-artifact@v3
        with:
          name: BazarControl-APK
          path: app/build/outputs/apk/release/app-release-unsigned.apk
